name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile=false

      - name: Build
        run: corepack pnpm build

      - name: Test
        run: corepack pnpm test

      - name: Validate corpus schemas
        run: |
          corepack pnpm bench -- \
            --corpus corpus/ \
            --tools conclave \
            --output results/ci-smoke/ \
            --concurrency 2
        env:
          # Deliberately omit LLM keys — adapter should return skipped=true
          # per case and exit 0. This exercises the corpus loader + adapter
          # harness without requiring secrets in public CI.
          CONCLAVE_BENCHMARKS_CI: "1"
